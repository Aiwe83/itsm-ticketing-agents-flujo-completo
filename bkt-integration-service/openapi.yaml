        "503":
          description: Database disconnected. Body is otherwise identical to the 200 case
            - `message` stays the literal "OK" even here; only `database` (and
            the HTTP status) differ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                degraded:
                  value:
                    uptime: 42.1

  version: 1.0.0-SNAPSHOT
  description: "ITSM TC Integration Service: recibe tickets de Jira/TC, guarda el
    bruto, los traduce con mappings guardados en MongoDB y notifica al
    orquestador. Generado a partir de los schemas Zod reales (src/validators,

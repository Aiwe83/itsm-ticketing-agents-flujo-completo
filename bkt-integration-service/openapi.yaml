      responses:
        "200":
          description: Database connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    uptime: 12345.67
                    message: OK
                    timestamp: 2026-08-06T09:00:00.000Z
                    environment: production
                    database: connected
        "404": &a1

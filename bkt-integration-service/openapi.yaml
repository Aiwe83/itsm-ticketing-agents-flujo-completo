  /api/v1/issues:
    post:
      operationId: createIssues
      tags:
      - Issues
      summary: Ingest one Jira/TC issue
      description: Accepts exactly ONE ticket per request (issues array has length 1).
        Persists the raw payload in itsm_tickets, translates it with the
        mappings stored in MongoDB, persists the normalized ticket in tickets,

components:
  schemas:
    ExecutionError:
      type: object
      properties:
        function:
          description: Origin function/method where the error was captured
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        errorMessage:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        timestamp:
          format: date-time
          description: UTC ISO-8601 timestamp
          type: string
          maxLength: 40
      required:
      - function
      - errorMessage
      - timestamp
      additionalProperties: false
    AttachedDocument:
      type: object
      properties:
        filename:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        markdown:
          type: string
          maxLength: 20000000
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        skippedReason:
          type: string
          enum:
          - unsupported
          - too_large
          - download_failed
      required:
      - filename
      - markdown
      additionalProperties: false
    IssueContent:
      description: Known subset of the mapped Jira fields (the `mappings` collection).
        The real field contract is driven by the "mappings" MongoDB collection
        and can carry additional keys not listed here - hence
        additionalProperties is open, not a bug.
      type: object
      properties:
        key:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        issueJiraId:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        summary:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        description:
          type: string
          maxLength: 50000
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        issueType:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        status:
          nullable: true
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        priority:
          nullable: true
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        components:
          maxItems: 200
          type: array
          items: {}
        assignee:
          type: object
          properties:
            accountId:
              type: string
              maxLength: 128
              pattern: ^[^\s\x00-\x1F\x7F]*$
            email:
              type: string
              maxLength: 500
              pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
            displayName:
              type: string
              maxLength: 500
              pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        attachedDocuments:
          maxItems: 100
          type: array
          items:
            $ref: "#/components/schemas/AttachedDocument"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    IssueInfo:
      type: object
      properties:
        meshId:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        itsmTicketId:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        ticketType:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        content:
          $ref: "#/components/schemas/IssueContent"
      required:
      - meshId
      - content
      additionalProperties: false
    IssuePayload:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        fields:
          type: object
          properties:
            summary:
              type: string
              minLength: 1
              maxLength: 500
              pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
            issuetype:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
              required:
              - name
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
          required:
          - summary
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
      required:
      - key
      - fields
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    IssueBatchRequest:
      type: object
      properties:
        initiatedBy:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        issues:
          minItems: 1
          maxItems: 1
          type: array
          items:
            $ref: "#/components/schemas/IssuePayload"
      required:
      - issues
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    IssueProcessResult:
      type: object
      properties:
        ticketId:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        issueId:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        success:
          type: boolean
        errors:
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/ExecutionError"
        issue:
          $ref: "#/components/schemas/IssuePayload"
        transformedIssue:
          $ref: "#/components/schemas/IssueInfo"
        receivedAt:
          format: date-time
          type: string
          maxLength: 40
        storedTicketId:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
      required:
      - ticketId
      - issueId
      - success
      - errors
      - issue
      - receivedAt
      additionalProperties: false
    IssueProcessSummary:
      type: object
      properties:
        ticketsProcessed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ticketsSucceeded:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ticketsFailed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        successIntegration:
          description: true only when every ticket in the batch succeeded (ticketsFailed
            === 0)
          type: boolean
        orchestratorDispatched:
          type: boolean
      required:
      - ticketsProcessed
      - ticketsSucceeded
      - ticketsFailed
      - successIntegration
      - orchestratorDispatched
      additionalProperties: false
    IssueProcessResponse:
      type: object
      properties:
        executionId:
          description: Same value as the itsm_tickets/tickets _id (execution_id)
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        summary:
          $ref: "#/components/schemas/IssueProcessSummary"
        tickets:
          minItems: 1
          maxItems: 1
          type: array
          items:
            $ref: "#/components/schemas/IssueProcessResult"
      required:
      - executionId
      - summary
      - tickets
      additionalProperties: false
    IssueAcceptedResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        data:
          $ref: "#/components/schemas/IssueProcessResponse"
      required:
      - success
      - message
      - data
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            message:
              type: string
              maxLength: 500
              pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
            code:
              type: string
              maxLength: 128
              pattern: ^[^\s\x00-\x1F\x7F]*$
            statusCode:
              type: integer
              minimum: 100
              maximum: 599
            details: {}
            timestamp:
              format: date-time
              type: string
              maxLength: 40
            requestId:
              type: string
              maxLength: 128
              pattern: ^[^\s\x00-\x1F\x7F]*$
            path:
              type: string
              maxLength: 128
              pattern: ^[^\s\x00-\x1F\x7F]*$
          required:
          - message
          - code
          - statusCode
          - timestamp
          additionalProperties: false
      required:
      - success
      - error
      additionalProperties: false
    RateLimitErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            message:
              type: string
              maxLength: 500
              pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
            code:
              type: string
              enum:
              - RATE_LIMIT_EXCEEDED
          required:
          - message
          - code
          additionalProperties: false
      required:
      - success
      - error
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        uptime:
          description: process.uptime() in seconds
          type: number
        message:
          description: Literal "OK" even on a 503 response - only the HTTP status and
            `database` differ.
          type: string
          enum:
          - OK
        timestamp:
          format: date-time
          type: string
          maxLength: 40
        environment:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
        database:
          type: string
          enum:
          - connected
          - disconnected
      required:
      - uptime
      - message
      - timestamp
      - environment
      - database
      additionalProperties: false
    ApiRootResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
          maxLength: 500
          pattern: ^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$
        version:
          type: string
          maxLength: 128
          pattern: ^[^\s\x00-\x1F\x7F]*$
      required:
      - success
      - message
      - version
      additionalProperties: false
    JsonPrimitive:
      description: Scalar JSON leaf value (string, number, boolean, or null).
      anyOf:
      - type: string
        maxLength: 50000
        nullable: true
      - type: number
      - type: boolean
    JsonValue:
      description: Any JSON value up to one level of nesting (scalar, or array/object
        of scalars). Extra Jira/mapping-driven keys are accepted as-is.
      anyOf:
      - $ref: "#/components/schemas/JsonPrimitive"
      - type: array
        maxItems: 1000
        items:
          $ref: "#/components/schemas/JsonPrimitive"
      - type: object
        maxProperties: 500
        additionalProperties:
          $ref: "#/components/schemas/JsonPrimitive"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Header name configurable via API_KEY_HEADER env var. Enforced by
        src/middlewares/auth.middleware.ts on every operation under /api/v1
        except getHealth. See README.md "Estado De Seguridad".
security: []

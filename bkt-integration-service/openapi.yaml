                          itsmTicketId: "13401"
                          ticketType: Incidencia
                          content:
                            title: Incidencia en la cuenta puente GTX
                            issueDescription: Me da error la cuenta puente intragrupo GTX.
                            status: Recibida
                            severityLevel: "3"
                            attachedDocuments: []
                        receivedAt: 2026-08-06T09:15:32.000Z
                        storedTicketId: mesh-pilot:PA-205
                aceptadoConFalloPorTicket:
                  value:
                    success: true
                    message: Issues accepted
                    data:
                      executionId: mesh-pilot:PA-206
                      summary:
                        ticketsProcessed: 1
                        ticketsSucceeded: 0
                        ticketsFailed: 1
                        successIntegration: false
                        orchestratorDispatched: false
                      tickets:
                      - ticketId: PA-206
                        issueId: "13402"
                        success: false
                        errors:
                        - function: issueService.processIssues
                          errorMessage: Missing required value for mapping content.title
                          timestamp: 2026-08-06T09:16:01.000Z
                        issue:
                          id: "13402"
                          key: PA-206
                          fields:
                            summary: Ticket sin campo obligatorio mapeado
                        receivedAt: 2026-08-06T09:16:01.000Z
                        storedTicketId: mesh-pilot:PA-206
        "400":
          description: "Validation failed. `details` takes one of two shapes depending on
            issue count: a single validation issue, or an
            AggregateValidationError with `details.errors[]` (see
            src/errors/validation.ts)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unSoloIssue:
                  value:
                    success: false
                    error:
                      message: Value at issues.0.key must be >= 1
                      code: VALIDATION_ERROR
                      statusCode: 400
                      details:
                        code: too_small
                        path:
                        - issues
                        - 0
                        - key
                        message: Value at issues.0.key must be >= 1
                      timestamp: 2026-08-06T09:10:00.000Z
                      requestId: 7c3a5e2e-1b3a-4b7a-9c2a-2e6a9d9e0a1f
                      path: /api/v1/issues
                variosIssues:
                  value:
                    success: false
                    error:
                      message: Multiple validation errors occurred
                      code: VALIDATION_ERROR
                      statusCode: 400
                      details:
                        errors:
                        - type: TooSmallValidationError
                          message: Value at issues.0.key must be >= 1
                          details:
                            path:
                            - issues
                            - 0
                            - key
                        - type: InvalidTypeValidationError
                          message: Invalid type at issues.0.fields.summary, expected string
                          details:
                            path:
                            - issues
                            - 0
                            - fields
                            - summary
                      timestamp: 2026-08-06T09:10:00.000Z
                      requestId: 7c3a5e2e-1b3a-4b7a-9c2a-2e6a9d9e0a1f
                      path: /api/v1/issues
        "401": *a4
        "429": *a5
        default: *a2
      security:

modules:
  jira:issuePanel:
    - key: asistente-incidencia-panel
      resource: asistente
      resolver:
        function: resolver
      viewportSize: xlarge
      title: bkt-jira-forge
      icon: resource:asistente;icon.svg

  function:
    - key: resolver
      handler: resolvers/index.handler

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/5624f551-6944-4a89-ad4c-e6239e541e69

resources:
  - key: asistente
    path: static/asistente-app/build

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app

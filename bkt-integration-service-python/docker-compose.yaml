name: bkt-integration-service-python

services:
  mongo:
    container_name: bkt-integration-service-python-mongo
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-local}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-local}
    ports:
      - "${MONGODB_PORT_HOST:-27019}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bkt-integration-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bkt-integration-service-python
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: local
      PORT: "8000"
      API_VERSION: v1
      HEALTH_CHECK_PATH: /health
      LOG_LEVEL: info
      LOG_PRETTY_PRINT: "true"
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ${MONGODB_DATABASE:-bkt-integration-service}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-local}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-local}
      MONGODB_MAX_POOL_SIZE: "10"
      MONGODB_MIN_POOL_SIZE: "5"
      API_KEY: ${API_KEY:-local-dev-api-key}
      API_KEY_HEADER: X-API-KEY
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://host.docker.internal:8001}
      ORCHESTRATOR_ENDPOINT: ${ORCHESTRATOR_ENDPOINT:-/api/v1/orchestrator/dispatch}
      ORCHESTRATOR_ROLE: ${ORCHESTRATOR_ROLE:-agentic-orchestrator-application}
      ORCHESTRATOR_TIMEOUT_MS: "30000"
      MESH_ID: ${MESH_ID:-6a323e68-6f87-403a-a87d-72da69fcde0d}
      ORIGINAL_TICKET_COLLECTION_NAME: ${ORIGINAL_TICKET_COLLECTION_NAME:-itsm_tickets}
      PROCESSED_TICKET_COLLECTION_NAME: ${PROCESSED_TICKET_COLLECTION_NAME:-tickets}
      EXECUTIONS_COLLECTION_NAME: ${EXECUTIONS_COLLECTION_NAME:-executions}
      MAPPINGS_COLLECTION_NAME: ${MAPPINGS_COLLECTION_NAME:-mappings}
    ports:
      - "${SERVICE_PORT:-8002}:8000"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    name: bkt-integration-service-python_mongo_data

[project]
name = "agentic-core"
version = "0.5.0"
description = "Agentic backend core built with Litestar"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dishka>=1.8.0",
    "langchain>=1.2.12",
    "langchain-aws[anthropic]>=1.4.0",
    "langchain-ibm>=1.0.4",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.2",
    "litestar[standard]>=2.21.1",
    "loguru>=0.7.3",
    "msgspec>=0.19.0",
    "openinference-instrumentation-langchain>=0.1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.34.0",
    "opentelemetry-instrumentation-asgi>=0.55b0",
    "opentelemetry-instrumentation-httpx>=0.55b0",
    "opentelemetry-sdk>=1.34.0",
    "pycryptodome>=3.23.0",
    "pymongo>=4.13.2",
    "redis[hiredis]>=6.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ty>=0.0.59",
]

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
